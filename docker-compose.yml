version: "3.9"
services:
  api:
    build: .
    container_name: fingraph-api
    ports: ["8000:8000"]
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=fingraph-demo
      - FS_LLM_PROVIDER=${FS_LLM_PROVIDER:-}
      - FS_LLM_MODEL=${FS_LLM_MODEL:-llama3.2}
      - FS_LLM_API_BASE=${FS_LLM_API_BASE:-http://ollama:11434}
    depends_on:
      neo4j: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    restart: unless-stopped
    networks: [graph-net]

  neo4j:
    image: neo4j:5-community
    container_name: fingraph-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/fingraph-demo
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1g
      - NEO4J_dbms_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./data/seed_cypher.cql:/import/seed.cql:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p fingraph-demo 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 8
      start_period: 40s
    networks: [graph-net]

  # Optional: local LLM via Ollama
  ollama:
    image: ollama/ollama:latest
    container_name: fingraph-ollama
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 4G }
    profiles: ["llm"]
    networks: [graph-net]

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_data:

networks:
  graph-net:
    driver: bridge
