[tool.poetry]
packages = [{include = "src"}]
name = "fingraph-sentinel"
version = "1.0.0"
description = "FinGraph Sentinel — GenAI Graph Engineering Agent for BFSI: Neo4j, Graph RAG, GNNs, AML, credit risk, insurance claims, KYC compliance."
authors = ["Mahesh Pravinsinh Solanki <maheshsinh1910@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/twomathematicians-code/fingraph-sentinel"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
neo4j = "^5.22.0"
pyyaml = "^6.0"

# LLM (optional — agent works deterministically without these)
langchain = "^0.2.0"
langchain-ollama = "^0.1.0"
langchain-openai = "^0.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
black = "^24.4.0"
ruff = "^0.4.0"
mypy = "^1.10.0"
bandit = "^1.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
