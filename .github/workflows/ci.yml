name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff
      - run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install poetry
      - run: poetry install --with dev
      - run: poetry run pytest tests/ -v --tb=short --ignore=tests/test_graph.py --cov=src --cov-report=term-missing

  graph-test:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/fingraph-demo
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p fingraph-demo 'RETURN 1'"
          --health-interval 10s --health-timeout 8s --health-retries 10
          --health-start-period 40s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install poetry && poetry install --with dev
      - run: poetry run pytest tests/test_graph.py -v --tb=short
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: fingraph-demo

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fingraph-sentinel .
