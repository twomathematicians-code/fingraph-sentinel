name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ruff && ruff check src/ tests/
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install poetry && poetry install --with dev
      - run: poetry run pytest tests/ -v --tb=short --ignore=tests/test_graph.py
  graph-test:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      neo4j:
        image: neo4j:5-community
        env: {NEO4J_AUTH: "neo4j/fingraph-demo"}
        ports: ["7687:7687"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install poetry && poetry install --with dev
      - run: poetry run pytest tests/test_graph.py -v --tb=short
        env: {NEO4J_URI: "bolt://localhost:7687", NEO4J_USER: "neo4j", NEO4J_PASSWORD: "fingraph-demo"}
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fingraph-sentinel .
